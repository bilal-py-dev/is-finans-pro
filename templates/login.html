<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | İş & Finans Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .title { text-align: center; margin-bottom: 1.8rem; }
        .title h1 { color: #34d399; font-size: 1.6rem; margin-bottom: 0.3rem; }
        .title p { color: #94a3b8; font-size: 0.85rem; }
        .error { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; }
        input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #10b981; }
        button { width: 100%; padding: 0.8rem; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #059669; }
        .hint { text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">
            <h1>İş & Finans Pro</h1>
            <p>Kurumsal CRM ve Yapay Zeka Finans Paneli</p>
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/login" method="post">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" required placeholder="••••••">
            </div>
            <button type="submit">Panele Giriş Yap</button>
        </form>
        <div class="hint">Varsayılan Giriş: admin / 123456</div>
    </div>
</body>
</html>
